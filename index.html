    class MapJob{
      constructor()
      {
        this.poslist = [];
        let map = L.map('map').setView([50.6442,5.5708], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        this.m = map;
      }
      AddPos(pos,link,text)
      {
          let llink = '<a href="'+link+'">'+text+'</a>';
          let fnd = false;
          for(let i=0;i<this.poslist.length;i++)
          {
            let l = this.poslist[i];
            if(l.x==pos.x && l.y==pos.y)
            {
              this.poslist[i].list.push(llink);
              fnd = true;
              break;
            }
          }
          if(fnd==false)
          {
            let l = [];
            l.push(llink);
            this.poslist.push({x:pos.x,y:pos.y,list:[llink]});
          }
      }
      Draw()
      {
        for(let i=0;i<this.poslist.length;i++)
        {
          let l = this.poslist[i];
          let strlink = "<li>";
          for(let j=0;j<l.list.length;j++)
          {
              strlink = strlink + "<ul>";
              strlink = strlink + l.list[j];
              strlink = strlink + "</ul>";
          }
          strlink = strlink + "</li>";
           L.marker([l.x,l.y]).addTo(this.m)
                .bindPopup(strlink)
                .openPopup();
        }
      }
    };
